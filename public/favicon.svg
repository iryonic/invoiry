<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Rail Obsidian with subtle top highlight -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141810"/>
      <stop offset="45%" stop-color="#070707"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>

    <!-- Electric Neon Lime Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF38"/>
      <stop offset="50%" stop-color="#B7FF00"/>
      <stop offset="100%" stop-color="#72E02A"/>
    </linearGradient>

    <!-- Surface Card Gradient for the Invoice/I Symbol -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2F4ED"/>
      <stop offset="100%" stop-color="#E5E8DF"/>
    </linearGradient>

    <!-- Folded Flap Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D5DDC8"/>
      <stop offset="100%" stop-color="#A8B498"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glowLime" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" ry="116" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" ry="110" fill="none" stroke="#B7FF00" stroke-opacity="0.22" stroke-width="3"/>
  <rect x="8" y="8" width="496" height="496" rx="108" ry="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Radial Lime Ambient Flare in Top-Left -->
  <circle cx="120" cy="110" r="140" fill="#B7FF00" fill-opacity="0.08" filter="url(#glowLime)"/>

  <!-- Top Dot of the "i" - Precision Terminal Beacon -->
  <g filter="url(#glowLime)">
    <circle cx="256" cy="120" r="44" fill="url(#limeGrad)"/>
    <circle cx="256" cy="120" r="16" fill="#FFFFFF" fill-opacity="0.95"/>
  </g>

  <!-- The "I" Body / Invoice Document Hybrid -->
  <g filter="url(#softShadow)">
    <!-- Main Sheet: 176px wide, 240px high, with top-right corner cut for fold -->
    <!-- Bounds: X from 168 to 344, Y from 192 to 432 -->
    <!-- Path with folded corner at top-right (304,192 to 344,232) -->
    <path d="M 188 192
             L 296 192
             L 344 240
             L 344 412
             Q 344 432 324 432
             L 188 432
             Q 168 432 168 412
             L 168 212
             Q 168 192 188 192 Z"
          fill="url(#sheetGrad)"/>

    <!-- Folded Corner Flap -->
    <path d="M 296 192
             L 296 232
             Q 296 240 304 240
             L 344 240 Z"
          fill="url(#foldGrad)"/>

    <!-- Invoice Content Slits (Minimal Receipt Lines) -->
    <!-- Line 1: Subtitle/Header -->
    <rect x="196" y="248" width="80" height="12" rx="6" fill="#111111" fill-opacity="0.85"/>

    <!-- Line 2: Highlight Line (Electric Lime Transaction / Total Bar) -->
    <rect x="196" y="278" width="120" height="16" rx="8" fill="url(#limeGrad)"/>

    <!-- Line 3: Data row -->
    <rect x="196" y="312" width="104" height="12" rx="6" fill="#111111" fill-opacity="0.25"/>

    <!-- Line 4: Data row -->
    <rect x="196" y="338" width="72" height="12" rx="6" fill="#111111" fill-opacity="0.25"/>

    <!-- Line 5: Micro Barcode / Receipt Teeth -->
    <g transform="translate(196, 374)">
      <rect x="0" y="0" width="6" height="24" rx="2" fill="#111111" fill-opacity="0.75"/>
      <rect x="11" y="0" width="12" height="24" rx="2" fill="#111111" fill-opacity="0.75"/>
      <rect x="28" y="0" width="6" height="24" rx="2" fill="#111111" fill-opacity="0.75"/>
      <rect x="39" y="0" width="18" height="24" rx="2" fill="#111111" fill-opacity="0.75"/>
      <rect x="62" y="0" width="6" height="24" rx="2" fill="#111111" fill-opacity="0.75"/>
      <rect x="73" y="0" width="14" height="24" rx="2" fill="#111111" fill-opacity="0.75"/>
      <rect x="92" y="0" width="28" height="24" rx="2" fill="url(#limeGrad)"/>
    </g>
  </g>
</svg>

